name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The converter's self-test, with its red arms
        run: python3 tools/adr-yaml.py --self-test
      - name: The manifest's self-test, with its red arms
        run: python3 tools/make-manifest.py --self-test
      - name: The manifest matches the payload
        run: python3 tools/make-manifest.py --check
